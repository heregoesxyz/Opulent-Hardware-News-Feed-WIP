<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opulent Hardware — Multi Feed</title>
  <style>
    :root {
      --bg: #000;
      --panel: rgba(255,255,255,.015);
      --muted: #9aa6b2;
      --text: #f2f6ff;
      --accent: #b6ff3b;
      --border: rgba(255,255,255,.04);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: radial-gradient(circle at top, #0f1215 0%, #000 60%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      overflow-y: scroll;
      overflow-x: hidden;
      color-scheme: dark;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,.03);
      padding: .75rem 1rem .5rem;
    }
    .title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .tabs {
      margin-top: .6rem;
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: rgba(255,255,255,.03);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: .3rem .7rem;
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .03em;
      cursor: pointer;
      color: var(--muted);
      white-space: nowrap;
    }
    .tab-btn.active {
      border-color: rgba(182,255,59,1);
      color: var(--text);
    }
    .searchbar {
      margin-top: .5rem;
      display: flex;
      gap: .5rem;
    }
    .searchbar input {
      flex: 1;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.02);
      border-radius: .65rem;
      padding: .4rem .65rem;
      color: inherit;
    }

    main {
      max-width: 1180px;
      margin: 1rem auto 0;
      padding: 0 1rem 7rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.02);
      border-radius: 1rem;
      padding: .7rem .8rem .85rem;
      display: flex;
      flex-direction: column;
      gap: .4rem;
      min-height: 140px;
    }
    .source {
      font-size: .6rem;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--muted);
    }
    .title-link {
      font-weight: 600;
      font-size: .9rem;
      line-height: 1.25;
      color: inherit;
      text-decoration: none;
      word-break: break-word;
    }
    .title-link:hover { text-decoration: underline; }
    .desc {
      font-size: .72rem;
      color: var(--muted);
    }
    .date {
      font-size: .6rem;
      color: rgba(242,246,255,.35);
      margin-top: auto;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2rem 0;
      color: var(--muted);
    }
    .fade-bottom {
      pointer-events: none;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 110px;
      background: linear-gradient(to top, #000 0%, rgba(0,0,0,0) 100%);
      z-index: 5;
    }
    .fade-right {
      pointer-events: none;
      position: fixed;
      top: 0;
      right: 0;
      width: 46px;
      height: 100%;
      background: linear-gradient(to left, #000 0%, rgba(0,0,0,0) 100%);
      z-index: 6;
    }
    .to-top {
      position: fixed;
      bottom: 1.1rem;
      right: 1.1rem;
      z-index: 10;
      background: rgba(0,0,0,.4);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      padding: .4rem .8rem;
      cursor: pointer;
      font-size: .7rem;
    }
    audio {
      width: 100%;
      margin-top: .25rem;
    }

    /* tape deck */
    .tape-deck {
      grid-column: 1 / -1;
      margin-bottom: 1rem;
    }
    .tape-body {
      background: radial-gradient(circle at top, #2b3136 0%, #131619 70%);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 1rem;
      padding: 1rem 1.2rem;
      position: relative;
      min-height: 150px;
      overflow: hidden;
    }
    .tape-body .label {
      position: absolute;
      bottom: .6rem;
      left: 1rem;
      font-size: .55rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: rgba(255,255,255,.3);
    }
    .reel {
      width: 70px;
      height: 70px;
      border: 4px solid rgba(0,0,0,.2);
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,.15) 0 25%, transparent 26% 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 3px, transparent 3px 6px);
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      animation: reel-spin 1.5s linear infinite;
      animation-play-state: paused;
      box-shadow: inset 0 0 18px rgba(0,0,0,.45);
    }
    .reel.left { left: 1.1rem; }
    .reel.right { right: 1.1rem; }
    .tape-deck.playing .reel {
      animation-play-state: running;
    }
    .window {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 150px;
      height: 46px;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.03);
      border-radius: .6rem;
      box-shadow: inset 0 0 12px rgba(0,0,0,.6);
    }
    @keyframes reel-spin {
      to { transform: translateY(-50%) rotate(360deg); }
    }

    /* dark scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
      background-color: transparent;
    }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.05);
      border-radius: 999px;
      border: 2px solid #000;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.6);
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255,255,255,0.1);
    }
    ::-webkit-scrollbar-corner { background: #000; }
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.05) #000;
    }

    @media (max-width: 900px) {
      main {
        padding: 0 .5rem 6rem;
        gap: .75rem;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
      header { padding: .6rem .7rem .45rem; }
    }
    @media (max-width: 560px) {
      main { grid-template-columns: 1fr; }
      .tabs { gap: .35rem; }
      .tab-btn { font-size: .62rem; padding: .28rem .55rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">OPULENT HARDWARE — MULTI FEED</div>
    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="news">BBC News</button>
      <button class="tab-btn" data-tab="market">Yahoo Finance</button>
      <button class="tab-btn" data-tab="podcasts">Podcasts</button>
    </div>
    <div class="searchbar">
      <input id="filterInput" placeholder="Filter results by keyword…">
    </div>
  </header>

  <main id="feed"></main>

  <div class="fade-bottom"></div>
  <div class="fade-right"></div>
  <button class="to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">Top</button>

  <script>
    // feeds
    const NEWS_FEED = "https://feeds.bbci.co.uk/news/rss.xml";
    const MARKET_FEEDS = [
      { name: "AAPL", url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s=AAPL&region=US&lang=en-US" },
      { name: "NVDA", url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s=NVDA&region=US&lang=en-US" },
      { name: "TSLA", url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s=TSLA&region=US&lang=en-US" }
    ];
    // single, reliable podcast
    const PODCAST_FEED = {
      name: "NPR Planet Money",
      url: "https://feeds.npr.org/510289/podcast.xml"
    };

    // we try: direct → allorigins → cors.isomorphic → rss2json (JSON)
    const proxyBuilders = [
      (url) => url,
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      (url) => `https://cors.isomorphic-git.org/${url}`,
      (url) => `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`
    ];

    const feedEl = document.getElementById('feed');
    const tabsEl = document.getElementById('tabs');
    const filterInput = document.getElementById('filterInput');

    // helper: fetch with timeout
    function fetchWithTimeout(resource, options = {}) {
      const { timeout = 4000 } = options;
      return Promise.race([
        fetch(resource, options),
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), timeout))
      ]);
    }

    // helper: try many endpoints until one works
    async function smartFetch(url) {
      for (const build of proxyBuilders) {
        const target = build(url);
        try {
          const resp = await fetchWithTimeout(target, { timeout: 4000 });
          if (!resp.ok) throw new Error("bad status");
          if (target.includes("api.rss2json.com")) {
            return { type: "json", data: await resp.json() };
          }
          return { type: "xml", data: await resp.text() };
        } catch (e) {
          // try next
        }
      }
      throw new Error("all fetch methods failed for " + url);
    }

    async function loadNews() {
      feedEl.innerHTML = '<div class="empty">Loading BBC news…</div>';
      try {
        const { data } = await smartFetch(NEWS_FEED);
        const xml = new DOMParser().parseFromString(data, "application/xml");
        const items = [...xml.querySelectorAll('item')].map(item => ({
          source: 'BBC News',
          title: item.querySelector('title')?.textContent?.trim() || '',
          desc: clean(item.querySelector('description')?.textContent || ''),
          link: item.querySelector('link')?.textContent?.trim() || '#',
          date: item.querySelector('pubDate')?.textContent?.trim() || ''
        }));
        renderList(items);
      } catch (e) {
        console.error(e);
        feedEl.innerHTML = '<div class="empty">Could not load BBC.</div>';
      }
    }

    async function loadMarket() {
      feedEl.innerHTML = '<div class="empty">Loading market headlines…</div>';
      const all = [];
      for (const mf of MARKET_FEEDS) {
        try {
          const { data } = await smartFetch(mf.url);
          const xml = new DOMParser().parseFromString(data, "application/xml");
          const items = [...xml.querySelectorAll('item')].map(item => ({
            source: `Yahoo Finance — ${mf.name}`,
            title: item.querySelector('title')?.textContent?.trim() || '',
            desc: clean(item.querySelector('description')?.textContent || ''),
            link: item.querySelector('link')?.textContent?.trim() || '#',
            date: item.querySelector('pubDate')?.textContent?.trim() || ''
          }));
          all.push(...items);
        } catch (e) {
          console.warn('market feed failed', mf.name, e);
        }
      }
      all.sort((a,b)=>new Date(b.date)-new Date(a.date));
      renderList(all);
    }

    async function loadPodcasts() {
      feedEl.innerHTML = '<div class="empty">Loading podcast…</div>';
      try {
        const { type, data } = await smartFetch(PODCAST_FEED.url);
        let items = [];
        if (type === "xml") {
          const xml = new DOMParser().parseFromString(data, "application/xml");
          items = [...xml.querySelectorAll('item')].slice(0,6).map(item => ({
            source: PODCAST_FEED.name,
            title: item.querySelector('title')?.textContent?.trim() || '',
            desc: clean(item.querySelector('description')?.textContent || ''),
            link: item.querySelector('link')?.textContent?.trim() || '#',
            date: item.querySelector('pubDate')?.textContent?.trim() || '',
            audio: extractAudio(item)
          }));
        } else {
          items = (data.items || []).slice(0,6).map(ep => ({
            source: PODCAST_FEED.name,
            title: ep.title || '',
            desc: clean(ep.description || ''),
            link: ep.link || '#',
            date: ep.pubDate || '',
            audio: ep.enclosure?.link || ''
          }));
        }

        // render cassette first
        feedEl.innerHTML = `
          <div id="tapeDeck" class="tape-deck">
            <div class="tape-body">
              <div class="reel left"></div>
              <div class="reel right"></div>
              <div class="window"></div>
              <div class="label">PODCAST TRANSPORT</div>
            </div>
          </div>
        `;

        renderPodcastList(items);
        attachAudioHandlers();
      } catch (e) {
        console.error(e);
        feedEl.innerHTML = '<div class="empty">Podcast feed could not be loaded.</div>';
      }
    }

    function extractAudio(item) {
      const enclosure = item.querySelector('enclosure');
      if (enclosure && enclosure.getAttribute('url')) return enclosure.getAttribute('url');
      const media = item.getElementsByTagName('media:content')[0];
      if (media && media.getAttribute('url')) return media.getAttribute('url');
      return '';
    }

    function clean(str) {
      return str.replace(/<!\[CDATA\[|\]\]>/g,'').replace(/<[^>]*>/g,'').trim();
    }

    function renderList(items) {
      const q = filterInput.value.trim().toLowerCase();
      const filtered = q
        ? items.filter(it =>
            it.title.toLowerCase().includes(q) ||
            it.desc.toLowerCase().includes(q) ||
            it.source.toLowerCase().includes(q)
          )
        : items;
      if (!filtered.length) {
        feedEl.innerHTML = '<div class="empty">No results.</div>';
        return;
      }
      feedEl.innerHTML = '';
      filtered.forEach(it => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="source">${it.source}</div>
          <a class="title-link" href="${it.link}" target="_blank" rel="noopener noreferrer">${it.title}</a>
          <div class="desc">${it.desc}</div>
          <div class="date">${it.date ? new Date(it.date).toLocaleString() : ''}</div>
        `;
        feedEl.appendChild(card);
      });
    }

    function renderPodcastList(items) {
      items.forEach(it => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="source">${it.source}</div>
          <a class="title-link" href="${it.link}" target="_blank" rel="noopener noreferrer">${it.title}</a>
          <div class="desc">${it.desc}</div>
          <div class="date">${it.date ? new Date(it.date).toLocaleString() : ''}</div>
        `;
        if (it.audio) {
          const audio = document.createElement('audio');
          audio.controls = true;
          audio.src = it.audio;
          card.appendChild(audio);
        }
        feedEl.appendChild(card);
      });
    }

    function attachAudioHandlers() {
      const tape = document.getElementById('tapeDeck');
      const audios = feedEl.querySelectorAll('audio');

      audios.forEach(a => {
        a.addEventListener('play', () => {
          // pause others
          audios.forEach(other => {
            if (other !== a) other.pause();
          });
          if (tape) tape.classList.add('playing');
        });
        a.addEventListener('pause', () => {
          const anyPlaying = Array.from(audios).some(x => !x.paused);
          if (!anyPlaying && tape) tape.classList.remove('playing');
        });
        a.addEventListener('ended', () => {
          const anyPlaying = Array.from(audios).some(x => !x.paused);
          if (!anyPlaying && tape) tape.classList.remove('playing');
        });
      });
    }

    // tab switching
    tabsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      if (tab === 'news') loadNews();
      if (tab === 'market') loadMarket();
      if (tab === 'podcasts') loadPodcasts();
    });

    // initial load
    loadNews();
  </script>
</body>
</html>
